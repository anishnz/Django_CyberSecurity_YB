{% if items %}<section class="panel panel-note"><h2 class="h5"><i class="bi bi-megaphone"></i> Pānui – announcements</h2>
{% for a in items %}<div class="{% if not forloop.last %}border-bottom pb-2 mb-2{% endif %}"><strong>{{ a.title }}</strong><div class="small">{{ a.body|truncatechars:220 }}</div></div>{% endfor %}
<a class="small" href="{% url 'announcements:list' %}">All announcements</a></section>{% endif %}
