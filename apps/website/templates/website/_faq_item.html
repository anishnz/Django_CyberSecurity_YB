<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button{% if n != 1 %} collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#f{{ n }}" aria-expanded="{% if n == 1 %}true{% else %}false{% endif %}" aria-controls="f{{ n }}">{{ q }}</button></h2>
<div id="f{{ n }}" class="accordion-collapse collapse{% if n == 1 %} show{% endif %}" data-bs-parent="#faq"><div class="accordion-body">{{ a }}</div></div></div>
