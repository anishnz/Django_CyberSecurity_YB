{% extends "base.html" %}
{% block title %}Report a question{% endblock %}
{% block content %}
<section class="panel mx-auto" style="max-width: 640px"><h1 class="h3"><i class="bi bi-flag"></i> Report this question</h1>
<p class="text-muted">{{ question.text }}</p>
<form method="post">{% csrf_token %}{% include "partials/form.html" %}<button class="btn btn-primary">Send to my teacher</button>
<a class="btn btn-outline-secondary" href="{% url 'helpdesk:ticket_list' %}">Cancel</a></form></section>
{% endblock %}
