# Package list for tools that read pyproject.toml (Vercel uses this). Keep it the same as requirements.txt.
[project]
name = "cyberquest"
version = "1.1.0"
description = "CyberQuest - Learn. Play. Decide. Stay Cyber Safe. (MSE800 Assessment 2, YB_student_project_270889991)"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6.0",
    "waitress>=3.0",
    "whitenoise>=6.7",
    "cryptography>=42.0",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    "reportlab>=4.0",
    "requests>=2.31",
    "filetype>=1.2",
]

# Code style settings (Jihe Qi, QA Lead). Run:  black .   and   pylint apps cyberquest tests
[tool.black]
line-length = 120
skip-string-normalization = true
extend-exclude = "migrations|staticfiles"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

# Vercel online demo (https://cyber-yb.vercel.app). Vercel installs requirements.txt,
# runs this build step, then collectstatic, and serves cyberquest/wsgi_vercel.py.
[tool.vercel]
entrypoint = "cyberquest.wsgi_vercel:application"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"
